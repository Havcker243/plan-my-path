name: Keep Render API Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
    steps:
      - name: Ping health endpoint
        if: ${{ env.RENDER_HEALTH_URL != '' }}
        run: |
          curl --fail --silent --show-error --max-time 20 "$RENDER_HEALTH_URL"
